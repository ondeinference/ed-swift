name: EdExample
options:
  bundleIdPrefix: com.ondeinference
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

packages:
  Ed:
    path: ../..

targets:
  EdExample:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - "*.xcodeproj"
    dependencies:
      - package: Ed
        product: Ed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ondeinference.EdExample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Ed Example
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_VERSION: "6.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
