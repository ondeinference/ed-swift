name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  validate:
    name: Validate package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build for macOS
        run: swift build

      - name: Build for iOS
        run: >
          xcodebuild build
          -scheme Ed
          -destination 'generic/platform=iOS'
          -skipPackagePluginValidation
          -skipMacroValidation

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Ed tags carry a `v` prefix, which SwiftPM's `from:` does not accept.
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Ed Swift SDK ${{ github.ref_name }}

            ### Installation

            Add Ed to your `Package.swift` dependencies:

            ```swift
            .package(url: "https://github.com/ondeinference/ed-swift.git", from: "${{ steps.version.outputs.version }}")
            ```

            ### Platforms

            | Platform | Minimum Version |
            |----------|----------------|
            | iOS      | 16.0           |
            | macOS    | 14.0           |
            | tvOS     | 16.0           |
            | visionOS | 1.0            |

            ### What's Changed

            See the full changelog in the [Ed ${{ github.ref_name }}](https://github.com/ondeinference/ed/releases/tag/${{ github.ref_name }}) release.
